# Smoke: synthesize 2 prostate S_val volumes with phase + sensitivity models.
# Maps are complex (H,W,2) with hard RSS. Data root = FastMRI prostate train T2.
#
#   direct synthesize /projects/direct/synthesis_diffusion/synthesize_prostate_smoke \
#     --cfg projects/synthesis/synthesize_prostate_smoke.yaml \
#     --phase-model /projects/direct/synthesis_diffusion/flow_matching_multi/model_290000.pt \
#     --sensitivity-model /projects/direct/synthesis_diffusion/sensitivity_maps_multi_500k/model_110000.pt \
#     --data-root /mnt/rhea/data_public/fastmri/prostate/training/T2 \
#     --filenames-filter projects/synthesis/lists/prostate/s_val_smoke.lst \
#     --device cuda --num-gpus 1

physics:
  forward_operator: fft2
  backward_operator: ifft2

model:
  model_name: synthesis.synthesis.PhaseFlowMatching
  engine_name: PhaseFlowMatchingEngine
  num_filters: 128
  num_pool_layers: 4
  num_integration_steps: 50
  eval_integration_steps: 30
  num_organs: 4
  organ_embed_dim: 16

additional_models:
  sensitivity_model:
    model_name: synthesis.synthesis.SensitivityMapSynthesizer
    engine_name: SensitivityMapEngine
    num_filters: 64
    num_pool_layers: 3
    map_size: 64
    num_organs: 4
    organ_embed_dim: 16

synthesize:
  num_coils: 20
  num_integration_steps: 30
  max_volumes: 2
  slices_per_volume: 3
  plot_acceleration: 4
  plot_center_fraction: 0.08

inference:
  batch_size: 1
  crop: null
  metrics: []
  dataset:
    name: FastMRI
    pass_attrs: true
    filenames_lists:
      - lists/prostate/s_val_smoke.lst
    filenames_lists_root: /home/g.yiasemis/projects/direct/projects/synthesis
    transforms:
      transforms_type: SYNTHESIS
      use_seed: true
      masking: null
      cropping:
        # Match training resolution (raw prostate k-space is 640x640).
        crop: "[320, 320]"
        image_center_crop: true
      augmentation:
        pad:
          - 320
          - 320
      sensitivity_map_estimation:
        estimate_sensitivity_maps: true
        sensitivity_maps_type: FULL_RSS
        sensitivity_maps_gaussian: null
      normalization:
        scaling_key: kspace
        scale_percentile: 0.99
      synthesis_calibration:
        synthesis_extract_phase_and_maps: true
        coil_map_mode: acs
    text_description: prostate_s_val_smoke

logging:
  log_interval: 1
  tensorboard:
    num_images: 2
