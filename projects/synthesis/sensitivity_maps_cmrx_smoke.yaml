# Dummy: CMRxReconDataset only (2023+2024 cine FullSample via flat symlinks).
# Verifies kspace_full + SYNTHESIS + FULL_RSS before the full multi-anatomy run.
# Must finish before maint_oct_26 (2026-10-05T00:00:00).
#
#   direct train /projects/direct/synthesis_diffusion \
#     --cfg projects/synthesis/sensitivity_maps_cmrx_smoke.yaml \
#     --num-gpus 1 --num-workers 2 --device cuda --name sensitivity_maps_cmrx_smoke

physics:
  forward_operator: fft2
  backward_operator: ifft2
model:
  model_name: synthesis.synthesis.SensitivityMapSynthesizer
  engine_name: SensitivityMapEngine
  num_filters: 32
  num_pool_layers: 3
  map_size: 64
  upsample_mode: nearest
  organ_dropout_prob: 0.15
  num_organs: 6
  organ_embed_dim: 16
  map_mag_weight: 1.0
  map_smooth_weight: 0.1
  map_smooth_penalty: l1

training:
  datasets:
    - name: CMRxRecon
      data_root: /projects/direct/synthesis_diffusion/cmrxrecon_cine/train
      filenames_lists:
        - lists/cardiac/s_train_smoke.lst
      filenames_lists_root: /home/g.yiasemis/projects/direct/projects/synthesis
      kspace_key: kspace_full
      compute_mask: false
      kspace_context: null
      transforms:
        transforms_type: SYNTHESIS
        use_seed: false
        masking: null
        cropping:
          crop: "[320, 320]"
          image_center_crop: true
        augmentation:
          pad:
            - 320
            - 320
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: FULL_RSS
          sensitivity_maps_gaussian: null
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
          coil_map_mode: acs
      text_description: cardiac_s_train_smoke
  batch_size: 2
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.01
  lr_step_size: 1000
  lr_gamma: 0.9
  lr_warmup_iter: 10
  num_iterations: 200
  validation_steps: 100
  gradient_clipping: 1.0
  checkpointer:
    checkpoint_steps: 100
  loss:
    losses:
      - function: map_loss
        multiplier: 1.0
      - function: map_mag_loss
        multiplier: 1.0
      - function: map_smooth_loss
        multiplier: 0.1
  metrics: []

validation:
  datasets:
    - name: CMRxRecon
      data_root: /projects/direct/synthesis_diffusion/cmrxrecon_cine/train
      filenames_lists:
        - lists/cardiac/s_val_smoke.lst
      filenames_lists_root: /home/g.yiasemis/projects/direct/projects/synthesis
      kspace_key: kspace_full
      compute_mask: false
      kspace_context: null
      transforms:
        transforms_type: SYNTHESIS
        use_seed: true
        masking: null
        cropping:
          crop: "[320, 320]"
          image_center_crop: true
        augmentation:
          pad:
            - 320
            - 320
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: FULL_RSS
          sensitivity_maps_gaussian: null
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
          coil_map_mode: acs
      text_description: cardiac_s_val_smoke
  batch_size: 1
  metrics: []

logging:
  log_interval: 10
  tensorboard:
    num_images: 2

inference:
  batch_size: 1
  crop: null
  metrics: []
  dataset:
    name: CMRxRecon
    data_root: /projects/direct/synthesis_diffusion/cmrxrecon_cine/train
    filenames_lists:
      - lists/cardiac/s_val_smoke.lst
    filenames_lists_root: /home/g.yiasemis/projects/direct/projects/synthesis
    kspace_key: kspace_full
    transforms:
      transforms_type: SYNTHESIS
      use_seed: true
      masking: null
      cropping:
        crop: "[320, 320]"
        image_center_crop: true
      augmentation:
        pad:
          - 320
          - 320
      sensitivity_map_estimation:
        estimate_sensitivity_maps: true
        sensitivity_maps_type: FULL_RSS
        sensitivity_maps_gaussian: null
      normalization:
        scaling_key: kspace
        scale_percentile: 0.99
      synthesis_calibration:
        synthesis_extract_phase_and_maps: true
        coil_map_mode: acs
    text_description: cardiac_s_val_smoke
