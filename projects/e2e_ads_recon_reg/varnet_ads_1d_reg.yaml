model:
    model_name: varnet.varnet.EndToEndVarNet3D
    engine_name: null
    num_layers: 10
    regularizer_num_filters: 32
    regularizer_num_pull_layers: 4
    regularizer_dropout: 0.0
additional_models:
    sampling_model:
        model_name: adaptive.policy.StraightThroughPolicy
        engine_name: null
        sampling_dimension: ONE_D
        st_slope: 10.0
        st_clamp: false
        use_softplus: true
        slope: 10.0
        fix_sign_leakage: true
        acceleration: null
        kspace_shape:
            - 11
            - 512
            - 246
        num_layers: 1
        kspace_sampler: false
        sampler_detach_mask: false
        sampler_chans: 16
        sampler_num_pool_layers: 3
        sampler_fc_size: 128
        sampler_drop_prob: 0.0
        sampler_num_fc_layers: 3
        sampler_activation: LEAKY_RELU
        sampling_type: STATIC
        num_time_steps: null
        num_slices: null
    sensitivity_model:
        model_name: unet.unet_2d.UnetModel2d
        engine_name: null
        in_channels: 2
        out_channels: 2
        num_filters: 16
        num_pool_layers: 4
        dropout_probability: 0.0
    registration_model:
        model_name: registration.registration.UnetRegistration2dModel
        engine_name: null
        warp_num_integration_steps: 2
        train_end_to_end: false
        reg_loss_factor: 1.0
        max_seq_len: 11
        unet_num_filters: 16
        unet_num_pool_layers: 4
        unet_dropout_probability: 0.0
        unet_normalized: true
physics:
    forward_operator: fft2
    backward_operator: ifft2
    use_noise_matrix: false
    noise_matrix_scaling: 1.0
training:
    datasets:
        -   name: CMRxRecon
            kspace_context: time
            text_description: train-4x
            transforms:
                registration:
                    registration: true
                    registration_simulate_reference: FROM_KEY
                    registration_simulate_reference_from_key_index: 6
                    registration_estimate_displacement: false
                padding_eps: 0
                masking:
                    name: FastMRIEquispaced
                    mode: STATIC
                    accelerations:
                        - 4.0327
                    center_fractions:
                        - 0.04
                use_seed: false
                delete_kspace: false
                delete_acs_mask: false
                use_acs_as_mask: true
                augmentation:
                    pad:
                        - 512
                        - 246
                sensitivity_map_estimation:
                    estimate_sensitivity_maps: true
                normalization:
                    scaling_key: acs_kspace
                    scale_percentile: 0.995
                random_augmentations:
                    random_rotation_probability: 0
                    random_flip_probability: 0
        -   name: CMRxRecon
            kspace_context: time
            text_description: train-6x
            transforms:
                registration:
                    registration: true
                    registration_simulate_reference: FROM_KEY
                    registration_simulate_reference_from_key_index: 6
                    registration_estimate_displacement: false
                padding_eps: 0
                masking:
                    name: FastMRIEquispaced
                    mode: STATIC
                    accelerations:
                        - 6
                    center_fractions:
                        - 0.04
                use_seed: false
                delete_kspace: false
                delete_acs_mask: false
                use_acs_as_mask: true
                augmentation:
                    pad:
                        - 512
                        - 246
                sensitivity_map_estimation:
                    estimate_sensitivity_maps: true
                normalization:
                    scaling_key: acs_kspace
                    scale_percentile: 0.995
                random_augmentations:
                    random_rotation_probability: 0
                    random_flip_probability: 0
        -   name: CMRxRecon
            kspace_context: time
            text_description: train-8x
            transforms:
                registration:
                    registration: true
                    registration_simulate_reference: FROM_KEY
                    registration_simulate_reference_from_key_index: 6
                    registration_estimate_displacement: false
                padding_eps: 0
                masking:
                    name: FastMRIEquispaced
                    mode: STATIC
                    accelerations:
                        - 8.2
                    center_fractions:
                        - 0.04
                use_seed: false
                delete_kspace: false
                delete_acs_mask: false
                use_acs_as_mask: true
                augmentation:
                    pad:
                        - 512
                        - 246
                sensitivity_map_estimation:
                    estimate_sensitivity_maps: true
                normalization:
                    scaling_key: acs_kspace
                    scale_percentile: 0.995
                random_augmentations:
                    random_rotation_probability: 0
                    random_flip_probability: 0
    model_checkpoint: null
    optimizer: Adam
    lr: 0.003
    weight_decay: 0.0
    batch_size: 1
    lr_step_size: 10000
    lr_gamma: 0.8
    lr_warmup_iter: 2000
    swa_start_iter: null
    num_iterations: 52021
    validation_steps: 8000
    gradient_steps: 1
    gradient_clipping: 0.0
    gradient_debug: false
    loss:
        crop: null
        losses:
            -   function: l1_loss
                multiplier: 1
            -   function: ssim_loss
                multiplier: 1
            -   function: ssim_3d_loss
                multiplier: 1
            -   function: displacement_field_smooth_loss_l1
                multiplier: 1
    checkpointer:
        checkpoint_steps: 1000
    metrics: []
    regularizers: []
validation:
    datasets:
        -   name: CMRxRecon
            kspace_context: time
            text_description: val-4x
            transforms:
                registration:
                    registration: true
                    registration_simulate_reference: FROM_KEY
                    registration_simulate_reference_from_key_index: 6
                    registration_estimate_displacement: false
                padding_eps: 0
                masking:
                    name: FastMRIEquispaced
                    mode: STATIC
                    accelerations:
                        - 4.0327
                    center_fractions:
                        - 0.04
                use_seed: true
                delete_kspace: false
                delete_acs_mask: false
                use_acs_as_mask: true
                augmentation:
                    pad:
                        - 512
                        - 246
                sensitivity_map_estimation:
                    estimate_sensitivity_maps: true
                normalization:
                    scaling_key: acs_kspace
                    scale_percentile: 0.995
                random_augmentations:
                    random_rotation_probability: 0
                    random_flip_probability: 0
        -   name: CMRxRecon
            kspace_context: time
            text_description: val-6x
            transforms:
                registration:
                    registration: true
                    registration_simulate_reference: FROM_KEY
                    registration_simulate_reference_from_key_index: 6
                    registration_estimate_displacement: false
                padding_eps: 0
                masking:
                    name: FastMRIEquispaced
                    mode: STATIC
                    accelerations:
                        - 6
                    center_fractions:
                        - 0.04
                use_seed: true
                delete_kspace: false
                delete_acs_mask: false
                use_acs_as_mask: true
                augmentation:
                    pad:
                        - 512
                        - 246
                sensitivity_map_estimation:
                    estimate_sensitivity_maps: true
                normalization:
                    scaling_key: acs_kspace
                    scale_percentile: 0.995
                random_augmentations:
                    random_rotation_probability: 0
                    random_flip_probability: 0
        -   name: CMRxRecon
            kspace_context: time
            text_description: val-8x
            transforms:
                registration:
                    registration: true
                    registration_simulate_reference: FROM_KEY
                    registration_simulate_reference_from_key_index: 6
                    registration_estimate_displacement: false
                padding_eps: 0
                masking:
                    name: FastMRIEquispaced
                    mode: STATIC
                    accelerations:
                        - 8.2
                    center_fractions:
                        - 0.04
                use_seed: true
                delete_kspace: false
                delete_acs_mask: false
                use_acs_as_mask: true
                augmentation:
                    pad:
                        - 512
                        - 246
                sensitivity_map_estimation:
                    estimate_sensitivity_maps: true
                normalization:
                    scaling_key: acs_kspace
                    scale_percentile: 0.995
                random_augmentations:
                    random_rotation_probability: 0
                    random_flip_probability: 0
    batch_size: 1
    metrics: &id001
        - fastmri_ssim
        - fastmri_psnr
    regularizers: []
    crop: null
# Inference: use sibling `varnet_ads_1d_reg_inference.yaml` with `direct predict`
# (active val-4x; other rates commented under masking there).
# Training / validation above keep all accelerations.
logging:
    log_as_image: null
    tensorboard:
        num_images: 4
