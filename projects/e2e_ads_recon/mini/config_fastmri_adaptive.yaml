# Mini run: 2D adaptive sampling + VarNet on FastMRI knee
# Data: Documents/data/public/fastmri/knee

model:
  model_name: varnet.varnet.EndToEndVarNet
  num_layers: 2
  regularizer_num_filters: 8
  regularizer_num_pull_layers: 2
  regularizer_dropout: 0.0

additional_models:
  sampling_model:
    model_name: adaptive.policy.StraightThroughPolicy
    sampling_dimension: ONE_D
    sampling_type: STATIC
    kspace_shape: [320, 320]
    num_layers: 1
    kspace_sampler: false
    sampler_chans: 8
    sampler_num_pool_layers: 2
    sampler_fc_size: 32
    sampler_num_fc_layers: 2
    sampler_drop_prob: 0.0
    sampler_activation: LEAKY_RELU
    st_slope: 10.0
    use_softplus: true
    slope: 10.0
    fix_sign_leakage: true
    acceleration: null
  sensitivity_model:
    model_name: unet.unet_2d.UnetModel2d
    in_channels: 2
    out_channels: 2
    num_filters: 8
    num_pool_layers: 2
    dropout_probability: 0.0

physics:
  forward_operator: fft2
  backward_operator: ifft2

training:
  datasets:
    - name: FastMRI
      text_description: mini-train-knee
      filenames_lists:
        - lists_fastmri/train.lst
      transforms:
        cropping:
          crop: "[320, 320]"
          crop_type: uniform
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
        normalization:
          scaling_key: masked_kspace
          scale_percentile: 0.99
        masking:
          name: FastMRIEquispaced
          accelerations: [4.0]
          center_fractions: [0.08]
          mode: STATIC
          range_mode: DISCRETE
        use_acs_as_mask: true
        target_acceleration: 4.0
        delete_kspace: false
        delete_acs_mask: false
        use_seed: false
  optimizer: Adam
  lr: 1.0e-4
  batch_size: 1
  num_iterations: 500
  validation_steps: 100
  checkpointer:
    checkpoint_steps: 100
  loss:
    crop: null
    losses:
      - function: l1_loss
        multiplier: 1.0

validation:
  datasets:
    - name: FastMRI
      text_description: mini-val-knee
      filenames_lists:
        - lists_fastmri/val.lst
      transforms:
        cropping:
          crop: "[320, 320]"
          crop_type: uniform
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
        normalization:
          scaling_key: masked_kspace
          scale_percentile: 0.99
        masking:
          name: FastMRIEquispaced
          accelerations: [4.0]
          center_fractions: [0.08]
          mode: STATIC
          range_mode: DISCRETE
        use_acs_as_mask: true
        target_acceleration: 4.0
        delete_kspace: false
        delete_acs_mask: false
        use_seed: true
  batch_size: 1
  metrics:
    - fastmri_psnr
    - fastmri_ssim
  crop: null

inference:
  dataset:
    name: FastMRI
    transforms:
      cropping:
        crop: "[320, 320]"
      masking:
        name: FastMRIEquispaced
        accelerations: [4.0]
        center_fractions: [0.08]
  batch_size: 1

