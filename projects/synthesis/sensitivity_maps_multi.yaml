# Multi-anatomy sensitivity-map synthesizer (same S_train/S_val as flow_matching_multi).
# Query: magnitude image + coil count N. Hard RSS: sum_c |S_c|^2 = 1.
# Full run: 500k iterations. Do not pass --training-root.
#
#   direct train /projects/direct/synthesis_diffusion \
#     --cfg projects/synthesis/sensitivity_maps_multi.yaml \
#     --num-gpus 1 --num-workers 4 --device cuda --name sensitivity_maps_multi_500k

physics:
  forward_operator: fft2
  backward_operator: ifft2
model:
  model_name: synthesis.synthesis.SensitivityMapSynthesizer
  engine_name: SensitivityMapEngine
  num_filters: 64
  num_pool_layers: 3
  map_size: 64
  upsample_mode: nearest
  num_organs: 4
  organ_embed_dim: 16
  map_mag_weight: 1.0

training:
  datasets:
    - name: FastMRI
      data_root: /mnt/rhea/data_public/fastmri/brain/multicoil_train
      filenames_lists:
        - lists/brain/s_train_2_coils.lst
      filenames_lists_root: /home/g.yiasemis/projects/direct/projects/synthesis
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: false
        masking: null
        cropping:
          crop: "[320, 320]"
          image_center_crop: true
        augmentation:
          pad:
            - 320
            - 320
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: FULL_RSS
          sensitivity_maps_gaussian: null
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
          coil_map_mode: acs
      text_description: brain_s_train_2c
    - name: FastMRI
      data_root: /mnt/rhea/data_public/fastmri/brain/multicoil_train
