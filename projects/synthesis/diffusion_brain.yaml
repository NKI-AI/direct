# Conditional phase diffusion on FastMRI brain.
# Train and val are disjoint directories passed on the CLI (not in this file).
#
#   direct train experiments/synthesis_diffusion \
#     --cfg projects/synthesis/diffusion_brain.yaml \
#     --training-root x \
#     --validation-root y \
#     --num-workers 8 --device cuda --name diffusion_brain

physics:
  forward_operator: fft2
  backward_operator: ifft2

model:
  model_name: synthesis.synthesis.PhaseDiffusion
  engine_name: PhaseDiffusionSynthesisEngine
  num_filters: 64
  num_pool_layers: 4
  timesteps: 1000
  eval_timesteps: 25

training:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: false
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: RSS_ESTIMATE
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: brain_train
  batch_size: 4
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.01
  lr_step_size: 20000
  lr_gamma: 0.5
  lr_warmup_iter: 500
  num_iterations: 100000
  validation_steps: 2000
  gradient_clipping: 1.0
  checkpointer:
    checkpoint_steps: 1000
  loss:
    losses:
      - function: noise_loss
        multiplier: 1.0
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

validation:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: true
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: RSS_ESTIMATE
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: brain_val
  batch_size: 4
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

logging:
  log_interval: 20
  tensorboard:
    num_images: 4

inference:
  batch_size: 1
  crop: null
  metrics: []
  dataset:
    name: FastMRI
    pass_attrs: true
    transforms:
      transforms_type: SYNTHESIS
      use_seed: true
      cropping:
        crop: reconstruction_size
        image_center_crop: true
      masking:
        name: FastMRIRandom
        accelerations: [4]
        center_fractions: [0.08]
      sensitivity_map_estimation:
        estimate_sensitivity_maps: true
        sensitivity_maps_type: RSS_ESTIMATE
      normalization:
        scaling_key: kspace
        scale_percentile: 0.99
      synthesis_calibration:
        synthesis_extract_phase_and_maps: true
