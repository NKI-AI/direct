# v2 of sensitivity_maps_multi_cardiac.yaml (run: sensitivity_maps_multi_cardiac_500k).
# Same model and losses. Changes:
#   - data: + MosaicMRI S_train / S_val via the MosaicMRI dataset (10 musculoskeletal anatomies,
#     one dataset per coil count)
#   - 15 organ codes (num_organs 6 -> 15): each MosaicMRI anatomy has its own code next to unknown
#   - compress_coils: 30 on every dataset (69 MosaicMRI volumes have 32-46 coils; no-op otherwise)
#   - map_smooth_loss multiplier 0.1 -> 10 (v1 term was ~0.0002 vs map loss ~0.65, i.e. inactive)
#   - 150k iterations with cosine decay (v1: 500k, x0.9 every 50k, never annealed)
#   - weight EMA 0.999, used for validation and generation
#   - validation on 20 volumes per organ (lists/*/s_val_sub.lst) every 10k iterations
#   - DataLoader timeout 600 s (v1 crashed on a 120 s worker timeout)
# The run is CPU data-bound: launch with --num-workers 12-16.

physics:
  forward_operator: fft2
  backward_operator: ifft2
model:
  model_name: synthesis.synthesis.SensitivityMapSynthesizer
  engine_name: SensitivityMapEngine
  num_filters: 64
  num_pool_layers: 3
  map_size: 64
  upsample_mode: nearest
  organ_dropout_prob: 0.15
  num_organs: 15
  organ_embed_dim: 16
  map_mag_weight: 1.0
  map_smooth_weight: 10.0
  map_smooth_penalty: l1
training:
  datasets:
  - name: FastMRI
    data_root: /mnt/rhea/data_public/fastmri/brain/multicoil_train
    filenames_lists:
    - lists/brain/s_train_2_coils.lst
    filenames_lists_root: /home/g.yiasemis/projects/direct/projects/synthesis
    pass_attrs: true
    transforms:
      transforms_type: SYNTHESIS
      use_seed: false
      masking: null
      cropping:
        crop: "[320, 320]"
        image_center_crop: true
      augmentation:
        pad:
        - 320
        - 320
      sensitivity_map_estimation:
        estimate_sensitivity_maps: true
        sensitivity_maps_type: FULL_RSS
        sensitivity_maps_gaussian: null
      normalization:
        scaling_key: kspace
        scale_percentile: 0.99
      synthesis_calibration:
        synthesis_extract_phase_and_maps: true
        coil_map_mode: acs
      compress_coils: 30
    text_description: brain_s_train_2c
  - name: FastMRI
    data_root: /mnt/rhea/data_public/fastmri/brain/multicoil_train
