# Conditional Flow Matching: magnitude → p(phase | magnitude)
# OT-CFM learns velocity field to transport noise → target phase via ODE.
# Simpler than diffusion: no noise schedule, direct velocity regression.
#
#   direct train experiments/synthesis_flow \
#     --cfg projects/magnitude_synthesis/flow_matching_e2e.yaml \
#     --training-root ~/Documents/data/public/fastmri/knee \
#     --validation-root ~/Documents/data/public/fastmri/knee/val \
#     --device cuda --name flow_knee

physics:
  forward_operator: fft2
  backward_operator: ifft2

model:
  model_name: synthesis.synthesis.PhaseFlowMatching
  engine_name: PhaseFlowMatchingEngine
  num_filters: 64
  num_pool_layers: 4
  num_integration_steps: 50
  eval_integration_steps: 10

training:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: synthesis
        use_seed: false
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: rss_estimate
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: knee_train
  batch_size: 4
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.01
  lr_step_size: 20000
  lr_gamma: 0.5
  lr_warmup_iter: 500
  num_iterations: 100000
  validation_steps: 2000
  gradient_clipping: 1.0
  checkpointer:
    checkpoint_steps: 5000
  loss:
    losses:
      - function: velocity_loss
        multiplier: 1.0
      # Optional: add phase losses during training (not just validation)
      # - function: phase_chordal_loss
      #   multiplier: 0.1
      # - function: phase_gradient_loss
      #   multiplier: 0.05
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

validation:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: synthesis
        use_seed: true
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: rss_estimate
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: knee_val
  batch_size: 4
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

logging:
  log_interval: 50
  tensorboard:
    num_images: 4
