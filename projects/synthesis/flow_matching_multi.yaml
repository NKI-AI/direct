# Multi-anatomy conditional phase flow matching (paper split).
# S_train coil groups from brain/knee/prostate/breast. Organ AdaIN + 128-ch U-Net.
# Do not pass --training-root (each dataset has data_root).
#
#   direct train /projects/direct/synthesis_diffusion \
#     --cfg projects/synthesis/flow_matching_multi.yaml \
#     --num-gpus 2 --num-workers 8 --device cuda --name flow_matching_multi

physics:
  forward_operator: fft2
  backward_operator: ifft2
model:
  model_name: synthesis.synthesis.PhaseFlowMatching
  engine_name: PhaseFlowMatchingEngine
  num_filters: 128
  num_pool_layers: 4
  num_integration_steps: 50
  eval_integration_steps: 30
  num_organs: 4
  organ_embed_dim: 16

training:
  datasets:
    - name: FastMRI
      data_root: /mnt/rhea/data_public/fastmri/brain/multicoil_train
      filenames_lists:
        - lists/brain/s_train_2_coils.lst
      filenames_lists_root: /home/g.yiasemis/projects/direct/projects/synthesis
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: false
        masking: null
        cropping:
          crop: "[320, 320]"
          image_center_crop: true
        augmentation:
          pad:
            - 320
            - 320
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: FULL_RSS
          sensitivity_maps_gaussian: null
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
          coil_map_mode: acs
      text_description: brain_s_train_2c
