# Real-data reconstruction baseline: varnet.varnet.EndToEndVarNet
# Train: R_train of brain, knee, prostate, breast, cardiac cine, MosaicMRI; one dataset per
#        (dataset, coil count) so batches share a shape. Image-space pad + center crop to
#        320x320, coils compressed to <= 30, random 1D Cartesian masks at 4x (8% ACS) / 8x (4% ACS),
#        random flips. No loss crop.
# Validate: R_val subsets (lists/*/r_val_sub.lst), full FOV (no crop / pad), fixed-seed masks
#        per acceleration, metrics on the header reconstruction size (validation.crop: header).
# 2 x A100, batch 4 per GPU, 100k iterations, Adam 3e-3, cosine decay.

physics:
  forward_operator: fft2
  backward_operator: ifft2
model:
  model_name: varnet.varnet.EndToEndVarNet
  num_layers: 12
  regularizer_num_filters: 64
  regularizer_num_pull_layers: 4
additional_models:
  sensitivity_model:
    model_name: unet.unet_2d.UnetModel2d
    in_channels: 2
    out_channels: 2
    num_filters: 32
    num_pool_layers: 4
    dropout_probability: 0.0
training:
  datasets:
  - name: FastMRI
    data_root: /mnt/rhea/data_public/fastmri/brain/multicoil_train
    filenames_lists:
    - lists/brain/r_train_2_coils.lst
    filenames_lists_root: /home/g.yiasemis/projects/direct/projects/synthesis
    pass_attrs: true
    transforms:
      compress_coils: 30
      sensitivity_map_estimation:
        estimate_sensitivity_maps: true
      normalization:
        scaling_key: masked_kspace
        scale_percentile: 0.995
      masking:
        name: FastMRIRandom
        accelerations:
        - 4
        - 8
        center_fractions:
        - 0.08
        - 0.04
      cropping:
        crop: "[320, 320]"
        image_center_crop: true
      augmentation:
        pad:
        - 320
        - 320
      random_augmentations:
        random_flip_probability: 0.5
      delete_kspace: false
      use_seed: false
    text_description: brain_r_train_2c
  - name: FastMRI
    data_root: /mnt/rhea/data_public/fastmri/brain/multicoil_train
