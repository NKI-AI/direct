      text_description: cardiac_8x
      filenames_lists:
        - ../lists/cardiac/val_cardiac.lst
      transforms:
        masking:
          name: FastMRIEquispaced
          accelerations:
            - 8
          center_fractions:
            - 0.04
        cropping:
          crop:
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
        normalization:
          scaling_key: masked_kspace
          scale_percentile: 0.995
        use_seed: true
  batch_size: 2
  metrics:
    - fastmri_ssim
    - fastmri_psnr
  regularizers: []
  crop:
logging:
  log_as_image:
  tensorboard:
    num_images: 4

