# Conditional phase diffusion on FastMRI brain (v2: aux phase losses).
# Same data as diffusion_brain.yaml. Noise ε-loss plus x0-hat phase terms.
# Eval uses 35 DDIM steps. LR drops 20% every 220k (ends ~4.1e-5, not 3e-6).
#
#   direct train /projects/direct/synthesis_diffusion \
#     --cfg projects/synthesis/diffusion_brain_phase.yaml \
#     --training-root /mnt/rhea/data_public/fastmri/brain/multicoil_train \
#     --validation-root /mnt/rhea/data_public/fastmri/brain/multicoil_val \
#     --num-workers 8 --device cuda --name diffusion_brain_phase

physics:
  forward_operator: fft2
  backward_operator: ifft2

model:
  model_name: synthesis.synthesis.PhaseDiffusion
  engine_name: PhaseDiffusionSynthesisEngine
  num_filters: 64
  num_pool_layers: 4
  timesteps: 1000
  eval_timesteps: 35

training:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: false
        cropping:
          crop: "[320, 320]"
          image_center_crop: true
        augmentation:
          pad:
            - 320
            - 320
        pad_coils: 32
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: RSS_ESTIMATE
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: brain_train
  batch_size: 4
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.01
  lr_step_size: 220000
  lr_gamma: 0.8
  lr_warmup_iter: 1000
  num_iterations: 885000
  validation_steps: 5000
  gradient_clipping: 1.0
  checkpointer:
    checkpoint_steps: 5000
  loss:
    losses:
      - function: noise_loss
        multiplier: 1.0
      - function: phase_chordal_loss
        multiplier: 0.1
      - function: phase_gradient_loss
        multiplier: 0.05
      - function: phase_mae_loss
        multiplier: 0.05
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

validation:
  datasets:
    - name: FastMRI
      pass_attrs: true
      filenames_lists:
        - lists/brain/val.lst
      transforms:
        transforms_type: SYNTHESIS
        use_seed: true
        cropping:
          crop: "[320, 320]"
          image_center_crop: true
        augmentation:
          pad:
            - 320
            - 320
        pad_coils: 32
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: RSS_ESTIMATE
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: brain_val
  batch_size: 4
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

logging:
  log_interval: 20
  tensorboard:
    num_images: 4

inference:
  batch_size: 1
  crop: null
  metrics: []
  dataset:
    name: FastMRI
    pass_attrs: true
    filenames_lists:
      - lists/brain/test.lst
    transforms:
      transforms_type: SYNTHESIS
      use_seed: true
      cropping:
        crop: "[320, 320]"
        image_center_crop: true
      augmentation:
        pad:
          - 320
          - 320
      pad_coils: 32
      masking:
        name: FastMRIRandom
        accelerations: [4]
        center_fractions: [0.08]
      sensitivity_map_estimation:
        estimate_sensitivity_maps: true
        sensitivity_maps_type: RSS_ESTIMATE
      normalization:
        scaling_key: kspace
        scale_percentile: 0.99
      synthesis_calibration:
        synthesis_extract_phase_and_maps: true
        coil_map_mode: birdcage
        coil_map_num_coils: 16
        coil_map_seed: 0
