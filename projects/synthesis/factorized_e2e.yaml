# Prefer phase_e2e.yaml / complex_e2e.yaml for the intended pipelines.
# Kept for the joint factorized synthesizer (phase + maps + MRI forward).

physics:
  forward_operator: fft2
  backward_operator: ifft2

model:
  model_name: synthesis.synthesis.FactorizedSynthesizer
  engine_name: FactorizedSynthesisEngine
  num_coils: 15
  num_filters: 32
  num_pool_layers: 3
  map_size: 32

training:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: false
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: RSS_ESTIMATE
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: knee_train
  batch_size: 1
  optimizer: Adam
  lr: 0.0001
  weight_decay: 0.0001
  lr_step_size: 10000
  lr_gamma: 0.5
  lr_warmup_iter: 100
  num_iterations: 20000
  validation_steps: 500
  gradient_clipping: 1.0
  checkpointer:
    checkpoint_steps: 1000
  loss:
    losses:
      - function: l1_loss
        multiplier: 1.0
  metrics: []

validation:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: true
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: RSS_ESTIMATE
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: knee_val
  batch_size: 1
  metrics: []

logging:
  log_interval: 20
  tensorboard:
    num_images: 4
