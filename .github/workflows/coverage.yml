name: Coverage
on:
  push:
    branches: [main]
  pull_request:
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      # Two-step sync: install deps + build tooling, then build/install `direct`
      # against the persistent build backend (it builds without isolation).
      - name: Sync dependencies
        run: |
          uv sync --frozen --no-install-project --python 3.12
          uv sync --frozen --python 3.12
      - name: Run tests with coverage
        run: uv run --frozen --with coverage python -m coverage run -m pytest --ignore=projects
      - name: Build coverage report
        run: uv run --frozen --with coverage python -m coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Don't fail CI when the token is unavailable (e.g. PRs from forks).
          fail_ci_if_error: false
