# Conditional Phase Diffusion: magnitude → p(phase | magnitude)
# DDPM on unit-complex (cos φ, sin φ) coordinates, conditioned on magnitude.
# Samples diverse phases for the same input; proper generative model for ill-posed problem.
#
#   direct train experiments/synthesis_diffusion \
#     --cfg projects/magnitude_synthesis/diffusion_e2e.yaml \
#     --training-root ~/Documents/data/public/fastmri/knee \
#     --validation-root ~/Documents/data/public/fastmri/knee/val \
#     --device cuda --name diffusion_knee

physics:
  forward_operator: fft2
  backward_operator: ifft2

model:
  model_name: synthesis.synthesis.PhaseDiffusion
  engine_name: PhaseDiffusionSynthesisEngine
  num_filters: 64
  num_pool_layers: 4
  timesteps: 1000
  eval_timesteps: 25  # DDIM steps for val sampling (still full val set vs GT)

training:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: synthesis
        use_seed: false
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: rss_estimate
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: knee_train
  batch_size: 4
  optimizer: AdamW
  lr: 0.0001
  weight_decay: 0.01
  lr_step_size: 20000
  lr_gamma: 0.5
  lr_warmup_iter: 500
  num_iterations: 100000
  validation_steps: 200
  gradient_clipping: 1.0
  checkpointer:
    checkpoint_steps: 1000
  loss:
    losses:
      - function: noise_loss
        multiplier: 1.0
      # Optional: add phase losses during training (not just validation)
      # - function: phase_chordal_loss
      #   multiplier: 0.1
      # - function: phase_gradient_loss
      #   multiplier: 0.05
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

validation:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: synthesis
        use_seed: true
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: rss_estimate
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
      text_description: knee_val
  batch_size: 4
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

logging:
  log_interval: 20
  tensorboard:
    num_images: 4

# Generate multicoil k-space from dataset magnitude (same transforms as training):
#
#   direct predict experiments/synthesis_diffusion/generated_sim \
#     --cfg projects/magnitude_synthesis/diffusion_e2e.yaml \
#     --checkpoint experiments/synthesis_diffusion/diffusion_knee/model_24000.pt \
#     --data-root ~/Documents/data/public/fastmri/knee/val \
#     --experiment_directory experiments/synthesis_diffusion/diffusion_knee \
#     --device mps --name diffusion_gen_sim
inference:
  batch_size: 1
  crop: null
  metrics: []
  coil_sensitivity:
    mode: surface
    num_coils: 15
    seed: 0
  dataset:
    name: FastMRI
    pass_attrs: true
    transforms:
      transforms_type: SYNTHESIS
      use_seed: true
      cropping:
        crop: reconstruction_size
        image_center_crop: true
      masking:
        name: FastMRIRandom
        accelerations: [4]
        center_fractions: [0.08]
      sensitivity_map_estimation:
        estimate_sensitivity_maps: true
        sensitivity_maps_type: RSS_ESTIMATE
      normalization:
        scaling_key: kspace
        scale_percentile: 0.99
      synthesis_calibration:
        synthesis_extract_phase_and_maps: true
