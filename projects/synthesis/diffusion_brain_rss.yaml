# Conditional phase diffusion on FastMRI brain (noise-only, full-kspace RSS maps).
# Labels: SENSE phase + S_c = IFFT(k_c)/RSS, no ACS/ESPIRiT. No pad_coils:
# one FastMRI dataset per coil-count list (2–28).
# Train: noise_loss only. Eval: 30 DDIM steps. LR: 0.9 every 50k.
#
#   direct train /projects/direct/synthesis_diffusion \
#     --cfg projects/synthesis/diffusion_brain_rss.yaml \
#     --training-root /mnt/rhea/data_public/fastmri/brain/multicoil_train \
#     --validation-root /mnt/rhea/data_public/fastmri/brain/multicoil_val \
#     --num-workers 8 --device cuda --name diffusion_brain_rss

physics:
  forward_operator: fft2
  backward_operator: ifft2
model:
  model_name: synthesis.synthesis.PhaseDiffusion
  engine_name: PhaseDiffusionSynthesisEngine
  num_filters: 64
  num_pool_layers: 4
  timesteps: 1000
  eval_timesteps: 30

training:
  datasets:
    - name: FastMRI
      pass_attrs: true
      filenames_lists:
        - lists/brain/train_2_coils.lst
      transforms:
        transforms_type: SYNTHESIS
        use_seed: false
        masking: null
        cropping:
          crop: "[320, 320]"
          image_center_crop: true
        augmentation:
          pad:
            - 320
            - 320
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: FULL_RSS
          sensitivity_maps_gaussian: null
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
          coil_map_mode: acs
      text_description: brain_train_2c
