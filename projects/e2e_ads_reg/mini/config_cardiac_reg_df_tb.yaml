# Mini run: adaptive dynamic sampling + recon + registration on CMRxRecon cine

model:
  model_name: varnet.varnet.EndToEndVarNet3D
  num_layers: 2
  regularizer_num_filters: 8
  regularizer_num_pull_layers: 2
  regularizer_dropout: 0.0

additional_models:
  sampling_model:
    model_name: adaptive.policy.StraightThroughPolicy
    sampling_dimension: ONE_D
    sampling_type: DYNAMIC_2D
    kspace_shape: [512, 246]
    num_time_steps: 11
    num_layers: 1
    kspace_sampler: false
    sampler_chans: 8
    sampler_num_pool_layers: 2
    sampler_fc_size: 32
    sampler_num_fc_layers: 2
    sampler_drop_prob: 0.0
    sampler_activation: LEAKY_RELU
    st_slope: 10.0
    use_softplus: true
    slope: 10.0
    fix_sign_leakage: true
    acceleration: null
  sensitivity_model:
    model_name: unet.unet_2d.UnetModel2d
    in_channels: 2
    out_channels: 2
    num_filters: 8
    num_pool_layers: 2
    dropout_probability: 0.0
  registration_model:
    model_name: registration.registration.UnetRegistration2dModel
    train_end_to_end: true
    decoupled_training: false
    rec_loss_factor: 1.0
    reg_loss_factor: 1.0
    max_seq_len: 11
    unet_num_filters: 8
    unet_num_pool_layers: 2
    unet_dropout_probability: 0.0
    unet_normalized: true
    warp_num_integration_steps: 1

physics:
  forward_operator: fft2
  backward_operator: ifft2

training:
  datasets:
    - name: CMRxRecon
      kspace_context: time
      text_description: mini-reg-train
      filenames_lists:
        - lists/train.lst
      transforms:
        augmentation:
          pad: [512, 246]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
        normalization:
          scaling_key: acs_kspace
          scale_percentile: 0.995
        registration:
          registration: true
          registration_simulate_reference: FROM_KEY
          registration_simulate_reference_from_key_index: 6
          registration_estimate_displacement: false
        masking:
          name: FastMRIEquispaced
          accelerations: [4.0]
          center_fractions: [0.04]
          mode: DYNAMIC
          range_mode: DISCRETE
        use_acs_as_mask: true
        target_acceleration: 4.0
        delete_kspace: false
        delete_acs_mask: false
        use_seed: false
  optimizer: Adam
  lr: 1.0e-4
  batch_size: 1
  num_iterations: 6
  validation_steps: 5
  checkpointer:
    checkpoint_steps: 1000
  loss:
    crop: null
    losses:
      - function: l1_loss
        multiplier: 1.0

validation:
  datasets:
    - name: CMRxRecon
      kspace_context: time
      text_description: mini-reg-val
      filenames_lists:
        - lists/val.lst
      transforms:
        augmentation:
          pad: [512, 246]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
        normalization:
          scaling_key: acs_kspace
          scale_percentile: 0.995
        registration:
          registration: true
          registration_simulate_reference: FROM_KEY
          registration_simulate_reference_from_key_index: 6
          registration_estimate_displacement: false
        masking:
          name: FastMRIEquispaced
          accelerations: [4.0]
          center_fractions: [0.04]
          mode: DYNAMIC
          range_mode: DISCRETE
        use_acs_as_mask: true
        target_acceleration: 4.0
        delete_kspace: false
        delete_acs_mask: false
        use_seed: true
  batch_size: 1
  metrics:
    - fastmri_psnr
    - fastmri_ssim
  crop: null

inference:
  dataset:
    name: CMRxRecon
    transforms:
      augmentation:
        pad: [512, 246]
      masking:
        name: FastMRIEquispaced
        accelerations: [4.0]
        center_fractions: [0.04]
        mode: DYNAMIC
  batch_size: 1
