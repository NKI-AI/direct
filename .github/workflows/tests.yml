name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # Two-step sync: install the runtime + build tooling first, then build and
      # (editable-)install `direct` against the now-present, persistent build
      # backend (`direct` is configured to build without isolation).
      - name: Sync dependencies
        run: |
          uv sync --frozen --no-install-project --python ${{ matrix.python-version }}
          uv sync --frozen --python ${{ matrix.python-version }}
      - name: Run pytest
        run: uv run --frozen pytest --ignore=projects
