# Tiny smoke — magnitude → complex (pipeline B), 2 iterations.
#
#   direct train /tmp/complex_smoke \
#     --cfg projects/synthesis/complex_smoke.yaml \
#     --training-root ~/Documents/data/public/fastmri/knee \
#     --validation-root ~/Documents/data/public/fastmri/knee/val \
#     --num-workers 0 --device cpu --name complex_smoke

physics:
  forward_operator: fft2
  backward_operator: ifft2

model:
  model_name: synthesis.synthesis.ComplexFromMagnitude
  engine_name: ComplexFromMagnitudeEngine
  num_filters: 8
  num_pool_layers: 2

training:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: false
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: RSS_ESTIMATE
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
  batch_size: 1
  optimizer: Adam
  lr: 0.0001
  weight_decay: 0.0
  lr_step_size: 1000
  lr_gamma: 0.5
  lr_warmup_iter: 0
  num_iterations: 6
  validation_steps: 100
  checkpointer:
    checkpoint_steps: 100
  loss:
    losses:
      - function: complex_l2_loss
        multiplier: 1.0
      - function: mag_l2_loss
        multiplier: 1.0
      - function: phase_chordal_loss
        multiplier: 1.0
      - function: phase_gradient_loss
        multiplier: 0.1
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

validation:
  datasets:
    - name: FastMRI
      pass_attrs: true
      transforms:
        transforms_type: SYNTHESIS
        use_seed: true
        cropping:
          crop: reconstruction_size
          image_center_crop: true
        masking:
          name: FastMRIRandom
          accelerations: [4]
          center_fractions: [0.08]
        sensitivity_map_estimation:
          estimate_sensitivity_maps: true
          sensitivity_maps_type: RSS_ESTIMATE
        normalization:
          scaling_key: kspace
          scale_percentile: 0.99
        synthesis_calibration:
          synthesis_extract_phase_and_maps: true
  batch_size: 1
  metrics:
    - phase_mae_deg
    - phase_chordal
    - phase_gradient

logging:
  log_interval: 1
  tensorboard:
    num_images: 2
