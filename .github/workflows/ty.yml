name: ty
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev)
        run: uv sync --frozen --dev --python 3.12

      - name: Run ty
        run: uv run --frozen ty check --output-format=github direct
